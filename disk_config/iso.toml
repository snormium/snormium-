# bootc-image-builder config for the Snormium installer ISO (Anaconda, offline, embeds the image)
[customizations.installer.kickstart]
contents = """
# Snormium: encrypted install is offered by Anaconda's UI; nothing forced here.
"""
[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Storage", "org.fedoraproject.Anaconda.Modules.Users", "org.fedoraproject.Anaconda.Modules.Localization", "org.fedoraproject.Anaconda.Modules.Network", "org.fedoraproject.Anaconda.Modules.Timezone"]
