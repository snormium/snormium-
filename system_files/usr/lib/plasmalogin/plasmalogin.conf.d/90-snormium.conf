# Snormium login screen (Plasma Login Manager). Distro default; users override via /etc/plasmalogin.conf.
# Group layout is KConfig nested groups, same shape as kscreenlockerrc.
[Greeter]
WallpaperPluginId=org.kde.image
ShowClock=true

[Greeter][Wallpaper][org.kde.image][General]
Image=file://@LOCKWALLPAPER@
FillMode=2
