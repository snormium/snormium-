# Snormium kernel tunables — conservative, desktop/gaming validated. No "magic" tweaks.
# Steam/Proton (esign, Proton 8+, wine-staging) recommended; harmless for desktop use.
vm.max_map_count = 2147483642
# Reduce swap thrash on gaming loads while keeping swap available for hibernate/oom safety.
vm.swappiness = 10
# Consumer protection: harden against common local attacks (Ubuntu already sets several).
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# Keep Ubuntu's unprivileged-userns restriction; Steam/Flatpak are handled by AppArmor unconfined profiles.
